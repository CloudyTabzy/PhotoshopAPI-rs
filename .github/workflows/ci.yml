# Continuous integration for the PhotoshopAPI-rs workspace.
#
# The Rust matrix mirrors upstream PhotoshopAPI's platform coverage
# (Windows/Linux/macOS x stable toolchain). The corpus fixtures are vendored,
# so the full test suite runs on every platform with no external downloads.
#
# The Python job runs on Linux only: it exercises the same compiled Rust code
# the matrix already covers on three operating systems, so repeating the wheel
# build three times would add minutes without adding coverage.

name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: ${{ matrix.os }} / stable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # `zip-backend-*` features are mutually exclusive by design (a compile
      # error guards enabling two), so `--all-features` can never build the
      # codec crates — enumerate the backends instead.
      - name: Test (alternate ZIP backends)
        run: |
          cargo test -p psd-codecs --lib --no-default-features --features zip-backend-zlib-rs
          cargo test -p psd-codecs --lib --no-default-features --features zip-backend-miniz
          cargo test -p psd --no-default-features --features "image,zip-backend-zlib-rs"

      - name: Test (serde feature)
        run: cargo test -p psd --no-default-features --features "image,serde,zip-backend-zlib-rs"

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Docs (warnings are errors)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  python:
    name: Python bindings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: maturin-${{ hashFiles('Cargo.lock') }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          manifest-path: crates/psd-py/Cargo.toml
          args: --release --out dist

      - name: Install wheel and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy
          python -m pip install --find-links dist photoshopapi-rs

      # 184 of these are ported one-for-one from upstream's psapi-test suite,
      # keeping upstream's own assertions; the rest cover this port's API.
      - name: pytest
        run: python -m pytest crates/psd-py/tests -q
