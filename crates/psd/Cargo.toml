[package]
name = "psd"
description = "User-facing Photoshop document API: LayeredFile, layers, channels, masks"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = ["image", "zip-backend-linflate"]
image = ["dep:image", "dep:psd-png"]
# Forwards `psd-core/serde`: `Serialize` views of descriptors and EngineData.
serde = ["psd-core/serde"]
# The ZIP codec's deflate engine — mirrors `psd-codecs`'s mutually exclusive
# `zip-backend-*` features (linflate+zlib-rs default; switching means
# building with `--no-default-features` and naming the backend, e.g.
# `--features "image,zip-backend-miniz"`).
zip-backend-zlib-rs = ["psd-codecs/zip-backend-zlib-rs"]
zip-backend-miniz = ["psd-codecs/zip-backend-miniz"]
zip-backend-linflate = ["psd-codecs/zip-backend-linflate"]

[dependencies]
psd-core.workspace = true
psd-codecs.workspace = true
thiserror.workspace = true
tracing.workspace = true
rayon.workspace = true
memmap2.workspace = true
moxcms.workspace = true
nalgebra.workspace = true
image = { workspace = true, optional = true }
psd-png = { workspace = true, optional = true }
uuid.workspace = true
