[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "photoshopapi-rs"
# Taken from the Cargo workspace version (see CHANGELOG.md).
dynamic = ["version"]
requires-python = ">=3.9"
dependencies = ["numpy>=1.26"]

[tool.maturin]
bindings = "pyo3"
module-name = "photoshopapi._native"
python-source = "python"
