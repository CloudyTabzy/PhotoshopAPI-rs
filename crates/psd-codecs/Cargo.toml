[package]
name = "psd-codecs"
description = "Pure byte/slice codecs for the PSD/PSB format: PackBits RLE, ZIP, prediction, endian, interleave"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
thiserror.workspace = true
rayon.workspace = true
libdeflater.workspace = true
# Optional: the portable-SIMD experiment (port TODO §F2b). The default build
# keeps the current scalar kernels; this is pulled in only when the `fearless`
# feature asks for it, so one binary can A/B the two implementations.
fearless_simd = { version = "1.0", optional = true }
# The `#[simd]` attribute: without it the code compiles but the per-level
# inlining the kernels need is not applied.
fearless_simd_macros = { version = "0.1", optional = true }

[features]
# Portable-SIMD kernels behind `fearless_simd` (prototype; see
# `prediction::fearless`). Off by default.
fearless = ["dep:fearless_simd", "dep:fearless_simd_macros"]
