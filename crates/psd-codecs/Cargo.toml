[package]
name = "psd-codecs"
description = "Pure byte/slice codecs for the PSD/PSB format: PackBits RLE, ZIP, prediction, endian, interleave"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
thiserror.workspace = true
rayon.workspace = true
libdeflater = { workspace = true, optional = true }
zlib-rs = { workspace = true, optional = true }
miniz_oxide = { workspace = true, optional = true }
linflate = { workspace = true, optional = true }
# The prediction kernels are written with `fearless_simd`'s portable vectors
# (port TODO §F2b): measured 1.98x on the byte prefix sum and 1.47x on the
# transpose over the serial chains, with a scalar backend for platforms
# without SIMD.
fearless_simd = "1.0"
# The `#[simd]` attribute: without it the same kernels measured 2.4x *slower*
# than scalar, so it is required, not an optimization.
fearless_simd_macros = "0.1"

[features]
default = ["zip-backend-zlib-rs"]
# `PSD_CODECS_FORCE_SCALAR=1` switches the prediction kernels to the pre-SIMD
# scalar chains for the whole process, so one binary can measure and test the
# two against each other. Off by default: without it the environment has no
# say in which code runs.
scalar-override = []
# The ZIP codec's deflate engine, one at a time (enforced in `zip.rs`).
# `zlib-rs` (Trifecta's pure-Rust zlib-ng port) is the default: measured
# within noise of C libdeflate on decode (~4 GiB/s on channel data) and
# faster on real-plane compress, with no C toolchain requirement. Select
# `zip-backend-libdeflater` for the C engine, `zip-backend-miniz` for
# miniz_oxide, or `zip-backend-linflate` for the znippy decoder (fastest
# measured inflate — pure Rust, zero deps — paired with zlib-rs deflate).
zip-backend-libdeflater = ["dep:libdeflater"]
zip-backend-zlib-rs = ["dep:zlib-rs"]
zip-backend-miniz = ["dep:miniz_oxide"]
zip-backend-linflate = ["dep:linflate", "dep:zlib-rs"]

[dev-dependencies]
# `examples/zip_bench`: every candidate engine in one binary for the A/B.
libdeflater.workspace = true
miniz_oxide.workspace = true
zlib-rs.workspace = true
linflate.workspace = true
ldeflate.workspace = true
