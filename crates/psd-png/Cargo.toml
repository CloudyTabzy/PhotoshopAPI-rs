[package]
name = "psd-png"
version = "0.4.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "Streaming, memory-bounded PNG decoder with no dependencies, built for the PhotoshopAPI-rs port."
# No `repository` until this lives somewhere that is not the author's GitHub. The crate is
# vendored into the PhotoshopAPI-rs workspace, not fetched from a registry.
publish = false
keywords = ["png", "image", "decode", "inflate", "streaming"]
categories = ["multimedia::images", "compression"]
exclude = ["bench/", "fuzz/", ".github/"]

[dependencies]

[features]
# Lets `PSD_PNG_FORCE_SCALAR=1` switch the SIMD filter kernel off for the whole process, so the
# kernel and the scalar path can be measured and tested against each other in one build. Off
# by default: without it the process environment has no say in which code runs.
scalar-override = []

# The profile and workspace tables below were present when this crate was a standalone
# repository. They are removed here because a workspace member cannot also be a workspace
# root, and cannot carry profiles of its own: `bench/` and `fuzz/` are excluded by the parent
# workspace instead, so both still build standalone, and the parent workspace declares no
# release profile, so the only thing lost is this crate's former `lto = "thin"` and
# `codegen-units = 1` for its own release builds. Re-applying this edit is part of syncing a
# newer revision of this crate into the workspace.
