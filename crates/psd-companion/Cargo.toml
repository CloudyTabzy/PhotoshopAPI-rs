[package]
name = "psd-companion"
description = "Readers for Adobe's companion formats: .abr brushes, .csh custom shapes, .ase swatch palettes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# `psd-codecs` needs exactly one `zip-backend-*` feature; mirror the
# selection so consumers can swap the deflate engine through this crate.
default = ["psd-codecs/zip-backend-zlib-rs"]
zip-backend-libdeflater = ["psd-codecs/zip-backend-libdeflater"]
zip-backend-zlib-rs = ["psd-codecs/zip-backend-zlib-rs"]
zip-backend-miniz = ["psd-codecs/zip-backend-miniz"]
zip-backend-linflate = ["psd-codecs/zip-backend-linflate"]

[dependencies]
psd-core = { workspace = true }
psd-codecs.workspace = true
thiserror = { workspace = true }
