[workspace]
resolver = "2"
members = ["crates/psd-core", "crates/psd-codecs", "crates/psd-png", "crates/psd", "crates/psd-companion", "crates/psd-py"]
# `crates/psd-png` carries its own benchmark and fuzz packages. Both declare themselves
# workspace roots so they build standalone; excluding them keeps them out of this workspace
# without breaking that.
exclude = ["crates/psd-png/bench", "crates/psd-png/fuzz"]

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
# The single project version; bump it with every CHANGELOG.md entry.
version = "0.13.26"

# Dependency versions are centralized here; crates pull them in with
# `workspace = true`.
[workspace.dependencies]
psd-core = { path = "crates/psd-core" }
psd-codecs = { path = "crates/psd-codecs", default-features = false }
psd-png = { path = "crates/psd-png" }
psd = { path = "crates/psd" }
psd-companion = { path = "crates/psd-companion" }

thiserror = "2"
tracing = "0.1"
rayon = "1"
memmap2 = "0.9"
moxcms = { version = "0.8.1", default-features = false, features = ["lut", "options"] }
libdeflater = "1"
# Optional ZIP backends for psd-codecs, selectable one at a time via its
# `zip-backend-*` features (zlib-rs is the default, measured in
# `psd-codecs/examples/zip_bench.rs`).
miniz_oxide = "0.9"
zlib-rs = "0.6"
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = { version = "1", features = ["preserve_order"] }
# No `extension-module` feature: PyO3 0.29 deprecates it, and it breaks
# `cargo test --workspace` linking on Linux/macOS. maturin sets
# `PYO3_BUILD_EXTENSION_MODULE` for wheel builds instead.
pyo3 = "0.29"
numpy = "0.29"
